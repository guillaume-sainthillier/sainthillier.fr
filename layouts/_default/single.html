{{- define "url" -}}{{ .Permalink | absURL }}{{- end -}}
{{- define "layout-class" -}}layout-page{{- end -}}

{{ define "main" }}
<section class="section">
    <div class="container">
        <div class="page-content mx-auto">
            {{- partial "typography" .Content | safeHTML -}}
            {{ with .Params.cta }}
            <div class="mt-12 text-center">
                <a class="btn btn-accent btn-lg" href="{{ .url }}">{{ .label }}</a>
            </div>
            {{ end }}
        </div>
    </div>
</section>
{{ end }}
