{{ $image := resources.Get "images/guillaume-sainthillier.jpg" | resources.Fingerprint "md5" }}
{{ $home := "" | absURL }}
{{ $freelance := site.Params.freelance }}
<script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "WebSite",
                "@id": {{ printf "%s#website" $home }},
                "url": {{ $home }},
                "name": {{ site.Title }},
                "inLanguage": "fr-FR",
                "publisher": { "@id": {{ printf "%s#person" $home }} }
            },
            {{- if .IsHome }}
            {
                "@type": "ProfilePage",
                "@id": {{ printf "%s#webpage" $home }},
                "url": {{ $home }},
                "name": {{ .Title }},
                "inLanguage": "fr-FR",
                "isPartOf": { "@id": {{ printf "%s#website" $home }} },
                "mainEntity": { "@id": {{ printf "%s#person" $home }} }
            },
            {{- with .Params.faq }}
            {{- $rate := printf "%v à %v € HT / jour" $freelance.dailyRateMin $freelance.dailyRateMax }}
            {
                "@type": "FAQPage",
                "@id": {{ printf "%s#faq" $home }},
                "inLanguage": "fr-FR",
                "isPartOf": { "@id": {{ printf "%s#webpage" $home }} },
                "mainEntity": [
                    {{- range $i, $item := . }}{{ if $i }},{{ end }}
                    {
                        "@type": "Question",
                        "name": {{ $item.question }},
                        "acceptedAnswer": { "@type": "Answer", "text": {{ replace $item.answer "{{ rate }}" $rate }} }
                    }
                    {{- end }}
                ]
            },
            {{- end }}
            {{- end }}
            {
                "@type": "Person",
                "@id": {{ printf "%s#person" $home }},
                "name": "Guillaume Sainthillier",
                "jobTitle": "Développeur web freelance PHP / Symfony à Toulouse",
                "gender": "male",
                "url": {{ $home }},
                "image": {{ $image.Permalink }},
                "email": {{ site.Params.contact.email }},
                "telephone": {{ site.Params.contact.phone }},
                "address": {
                    "@type": "PostalAddress",
                    "addressLocality": "Toulouse",
                    "postalCode": "31100",
                    "addressRegion": "Occitanie",
                    "addressCountry": "FR"
                },
                {{/* The company entity lives on silarhi.fr: reference it instead of declaring a second business */}}
                "worksFor": {
                    "@type": "Organization",
                    "@id": "https://silarhi.fr/#organization",
                    "name": "SILARHI",
                    "url": "https://silarhi.fr"
                },
                "knowsAbout": ["PHP", "Symfony", "API Platform", "Doctrine", "EBICS", "CFONB", "MySQL", "PostgreSQL", "Docker", "AWS"],
                "makesOffer": {
                    "@type": "Offer",
                    "itemOffered": {
                        "@type": "Service",
                        "name": "Développement web freelance PHP / Symfony",
                        "areaServed": [
                            { "@type": "City", "name": "Toulouse" },
                            { "@type": "Country", "name": "France" }
                        ]
                    },
                    "priceSpecification": {
                        "@type": "UnitPriceSpecification",
                        "minPrice": {{ $freelance.dailyRateMin }},
                        "maxPrice": {{ $freelance.dailyRateMax }},
                        "priceCurrency": "EUR",
                        "unitCode": "DAY",
                        "unitText": "jour",
                        "valueAddedTaxIncluded": false
                    }
                },
                "sameAs": [
                    {{ site.Params.Social.linkedin }},
                    {{ site.Params.Social.github }},
                    {{ site.Params.Social.gitlab }},
                    "https://stackoverflow.com/users/7652866/guillaume-sainthillier"
                ]
            }
        ]
    }
</script>
