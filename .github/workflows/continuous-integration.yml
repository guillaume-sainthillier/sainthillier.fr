name: 'Continuous Integration'

on:
    pull_request:
    push:
        branches:
            - 'main'

permissions:
    contents: read

# Supersede outdated runs of a pull request; push runs (head_ref empty) are never cancelled.
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'yarn'
            - name: Install dependencies
              run: yarn install --frozen-lockfile
            - name: Biome
              run: yarn lint-ci
            - name: Prettier
              run: yarn prettier:check
            - name: Knip
              run: yarn knip

    ci-passed:
        name: CI passed
        needs: [lint]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check that all required jobs succeeded
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: exit 1
