name: 'Bundle Size'

on:
    pull_request:
        branches:
            - main
            - master

permissions:
    contents: read

# Supersede outdated runs of a pull request; push runs (head_ref empty) are never cancelled.
concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    size:
        name: Bundle size
        permissions:
            contents: read
            pull-requests: write
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # pnpm/action-setup reads the pnpm version from the PR's package.json "packageManager"
            - name: Checkout PR branch (pnpm version)
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            # Build base branch first
            - name: Checkout base branch
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.base_ref }}

            # A base that cannot be installed or built (e.g. one still on Yarn) is reported as empty
            - name: Install dependencies (base)
              continue-on-error: true
              run: pnpm install --frozen-lockfile

            - name: Build (base)
              continue-on-error: true
              run: pnpm build

            - name: Get bundle size (base)
              run: |
                  pnpm --silent size:json > /tmp/size-base.json 2>/dev/null || echo "[]" > /tmp/size-base.json
                  cat /tmp/size-base.json

            # Build PR branch
            - name: Checkout PR branch
              uses: actions/checkout@v7
              with:
                  clean: false

            - name: Install dependencies (PR)
              run: pnpm install --frozen-lockfile

            - name: Build (PR)
              run: pnpm build

            - name: Get bundle size (PR)
              run: |
                  pnpm --silent size:json > /tmp/size-pr.json 2>/dev/null || echo "[]" > /tmp/size-pr.json
                  cat /tmp/size-pr.json

            - name: Post comparison comment
              # Pull requests from forks get a read-only token and cannot comment.
              if: github.event.pull_request.head.repo.full_name == github.repository
              uses: actions/github-script@v9
              # Branch names are attacker-controllable on fork PRs: pass them as data, never as code.
              env:
                  BASE_REF: ${{ github.base_ref }}
                  HEAD_REF: ${{ github.head_ref }}
              with:
                  script: |
                      const fs = require('fs');

                      const baseData = JSON.parse(fs.readFileSync('/tmp/size-base.json', 'utf8'));
                      const prData = JSON.parse(fs.readFileSync('/tmp/size-pr.json', 'utf8'));

                      // Create a map of base sizes
                      const baseMap = {};
                      for (const entry of baseData) {
                        baseMap[entry.name] = entry.size;
                      }

                      let table = '| Name | Base | PR | Diff |\n|------|------|-----|------|\n';

                      for (const entry of prData) {
                        const prSize = entry.size;
                        const baseSize = baseMap[entry.name] || 0;
                        const diff = prSize - baseSize;

                        const prKB = (prSize / 1024).toFixed(2);
                        const baseKB = (baseSize / 1024).toFixed(2);
                        const diffKB = (diff / 1024).toFixed(2);

                        let diffStr = '';
                        if (diff > 0) {
                          diffStr = `+${diffKB} kB 🔺`;
                        } else if (diff < 0) {
                          diffStr = `${diffKB} kB 🟢`;
                        } else {
                          diffStr = '0 kB';
                        }

                        table += `| ${entry.name} | ${baseKB} kB | ${prKB} kB | ${diffStr} |\n`;
                      }

                      const body = `## 📦 Bundle Size Report\n\n${table}\n\n<sub>Comparing \`${process.env.BASE_REF}\` (base) with \`${process.env.HEAD_REF}\` (PR)</sub>`;

                      // Find existing comment
                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                      });

                      const botComment = comments.find(c =>
                        c.user.type === 'Bot' && c.body.includes('Bundle Size Report')
                      );

                      if (botComment) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: botComment.id,
                          body
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body
                        });
                      }
