[build]
publish = "public"
command = "pnpm build"

[build.environment]
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"
HUGO_EXTENDED = "true"
# Same Node.js as the CI: Hugo runs the Tailwind CSS CLI under Node's permission model
NODE_VERSION = "26"

# Build previews against their own URL so absolute links (canonical, og:image, JSON-LD) resolve on the preview
[context.deploy-preview]
command = "pnpm build --baseURL $DEPLOY_PRIME_URL"

# Keeps Hugo's processed images (resources/_gen) between builds
[[plugins]]
  package = "./netlify/plugins/hugo-cache"

[[redirects]]
  from = "/cgv"
  to = "/conditions-generales-de-vente/"
  status = 301
  force = true

[[redirects]]
  from = "/realisations/*"
  to = "/#portfolio/:splat"
  status = 301
  force = true

# Former CV URLs (fingerprinted or old build path), all indexed by Google
[[redirects]]
  from = "/build/pdf/CV-SAINTHILLIER-Guillaume.pdf"
  to = "/pdf/CV-SAINTHILLIER-Guillaume.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/pdf/CV-SAINTHILLIER-Guillaume.fac5d7b15bb5d8cba8a08d4758c1563e.pdf"
  to = "/pdf/CV-SAINTHILLIER-Guillaume.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/pdf/CV-SAINTHILLIER-Guillaume.152a671a1d40431b05f5bce47faec02e989018a82f707c0d109430fb0542f1ef.pdf"
  to = "/pdf/CV-SAINTHILLIER-Guillaume.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/pdf/CV-SAINTHILLIER-Guillaume.3c2893f87a907209ce59dfb64a910a88.pdf"
  to = "/pdf/CV-SAINTHILLIER-Guillaume.pdf"
  status = 301
  force = true

# Former CGV URLs (fingerprinted or old build path)
[[redirects]]
  from = "/build/pdf/CGV.pdf"
  to = "/pdf/CGV.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/pdf/CGV.25b445b76d2bce37352f094cff4c8a2cc2fcb02c105e6e6c58bdae2e57ae5e8c.pdf"
  to = "/pdf/CGV.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/pdf/CGV.6ea57ea8f741da5492c6ad991c7d44b6.pdf"
  to = "/pdf/CGV.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/pdf/CGV.5f98a198ff8b86ea34b978d7296a7d80.pdf"
  to = "/pdf/CGV.pdf"
  status = 301
  force = true

# The Open Graph image moved out of /images/ (immutable, fingerprinted files only); social networks cache the old URL
[[redirects]]
  from = "/images/og-image.jpg"
  to = "/og-image.jpg"
  status = 301
  force = true

# Catch-all must stay last: Netlify applies the first matching rule
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security headers of every response (Netlify adds Strict-Transport-Security itself). The CSP allows the site
# itself, the Umami tracker and its endpoint (analytics.sainthillier.fr) and Formspree (contact form, sent by
# fetch or, without JavaScript, by the form itself); 'unsafe-inline' styles because production inlines the
# stylesheet. Netlify drops the newlines: keep one directive per line, each ending with a semicolon
[[headers]]
  for = "/*"
  [headers.values]
	Content-Security-Policy = '''
	default-src 'self';
	script-src 'self' https://analytics.sainthillier.fr;
	style-src 'self' 'unsafe-inline';
	img-src 'self' data:;
	font-src 'self';
	connect-src 'self' https://analytics.sainthillier.fr https://formspree.io;
	form-action 'self' https://formspree.io;
	frame-ancestors 'none';
	base-uri 'self';
	object-src 'none';
	upgrade-insecure-requests;'''
	X-Content-Type-Options = "nosniff"
	X-Frame-Options = "DENY"
	Referrer-Policy = "strict-origin-when-cross-origin"
	Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
	Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/build/*"
  [headers.values]
	cache-control = '''
	max-age=31536000,
	public,
	immutable'''

# Images processed by Hugo, fingerprinted (keep unfingerprinted files such as og-image.jpg out of this folder)
[[headers]]
  for = "/images/*"
  [headers.values]
	cache-control = '''
	max-age=31536000,
	public,
	immutable'''
